<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>💰 Cloud Expense Tracker</h1>
    <p>Track your income and expenses easily</p>
</header>

<main>

    <section class="summary">

        <div class="card">
            <h3>Total Income</h3>
            <p id="income">₹0</p>
        </div>

        <div class="card">
            <h3>Total Expenses</h3>
            <p id="expenses">₹0</p>
        </div>

        <div class="card">
            <h3>Balance</h3>
            <p id="balance">₹0</p>
        </div>

    </section>


    <section class="form-section">

        <h2>Add Transaction</h2>

        <input
            type="text"
            id="title"
            placeholder="Transaction title"
        >

        <input
            type="number"
            id="amount"
            placeholder="Amount"
        >

        <select id="type">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
        </select>

        <button onclick="addTransaction()">
            Add Transaction
        </button>

    </section>


    <section class="transactions">

        <div class="transaction-header">
            <h2>Transaction History</h2>

            <input
                type="text"
                id="search"
                placeholder="Search..."
                onkeyup="searchTransactions()"
            >
        </div>

        <div id="transactionList"></div>

    </section>

</main>

<footer>
    <p>© 2026 Cloud Expense Tracker</p>
</footer>

<script src="script.js"></script>

</body>
</html>
